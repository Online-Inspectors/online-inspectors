<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Inspectors — Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
    }

    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 2rem;
    }

    input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #ffffff;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid #38bdf8;
    }

    button {
      padding: 0.85rem 1.8rem;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
    }

    button:hover {
      background-color: #0369a1;
    }

    .hidden {
      display: none !important;
    }

    .status-msg {
      color: #38bdf8;
      font-style: italic;
      margin-bottom: 1.5rem;
    }

    .error-msg {
      background-color: #7f1d1d;
      color: #fca5a5;
      padding: 1rem;
      border-radius: 8px;
      font-style: normal;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 1.5rem;
      border-radius: 10px;
    }

    .card h2 {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    .card p {
      margin-bottom: 0.6rem;
      color: #cbd5e1;
    }

    ul {
      list-style-type: square;
      padding-left: 1.2rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Online Inspectors</h1>
      <p>Automated Domain Intelligence & Security Lookup</p>
    </header>

    <main>
      <div class="search-box">
        <input type="text" id="domainInput" placeholder="Enter domain (e.g., gemini.google.com)">
        <button id="inspectBtn">Inspect Domain</button>
      </div>

      <div id="loading" class="status-msg hidden">Querying registries and DNS...</div>
      <div id="error" class="status-msg error-msg hidden"></div>

      <div id="results" class="results-grid hidden">
        <div class="card">
          <h2>Domain Summary</h2>
          <p><strong>Target:</strong> <span id="resDomain">-</span></p>
        </div>

        <div class="card">
          <h2>RDAP Registration</h2>
          <p><strong>Status:</strong> <span id="rdapStatus">-</span></p>
          <p><strong>Creation Date:</strong> <span id="rdapCreated">-</span></p>
          <p><strong>Handle:</strong> <span id="rdapHandle">-</span></p>
        </div>

        <div class="card">
          <h2>DNS Records (A)</h2>
          <ul id="dnsList"></ul>
        </div>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = "http://127.0.0.1:5000/inspect";

    document.getElementById("inspectBtn").addEventListener("click", runInspection);
    document.getElementById("domainInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") runInspection();
    });

    async function runInspection() {
      const input = document.getElementById("domainInput").value.trim();
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      const results = document.getElementById("results");

      if (!input) return;

      loading.classList.remove("hidden");
      error.classList.add("hidden");
      results.classList.add("hidden");

      try {
        const response = await fetch(`${BACKEND_URL}?domain=${encodeURIComponent(input)}`);
        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        loading.classList.add("hidden");

        document.getElementById("resDomain").textContent = data.domain || input;

        if (data.rdap && data.rdap.status === "success") {
          document.getElementById("rdapStatus").textContent = "Found";
          document.getElementById("rdapCreated").textContent = data.rdap.creation_date || "Unknown";
          document.getElementById("rdapHandle").textContent = data.rdap.handle || "N/A";
        } else {
          document.getElementById("rdapStatus").textContent = "Not Found / Error";
          document.getElementById("rdapCreated").textContent = "-";
          document.getElementById("rdapHandle").textContent = "-";
        }

        const dnsList = document.getElementById("dnsList");
        dnsList.innerHTML = "";
        if (data.dns && data.dns.status === "success" && data.dns.answers.length > 0) {
          data.dns.answers.forEach((ans) => {
            const li = document.createElement("li");
            li.textContent = `${ans.name} ➔ ${ans.data} (TTL: ${ans.TTL})`;
            dnsList.appendChild(li);
          });
        } else {
          const li = document.createElement("li");
          li.textContent = "No A records returned";
          dnsList.appendChild(li);
        }

        results.classList.remove("hidden");
      } catch (err) {
        loading.classList.add("hidden");
        error.textContent = `Failed to connect to backend: ${err.message}`;
        error.classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
